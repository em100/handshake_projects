
pipeline:
  name: "ADAS Multi-Sensor Perception"
  fusion_strategy: "late"

data:
  dataset: "nuscenes"
  root: "/workspace/data/nuscenes"
  sensors:
    camera: true
    lidar: true
    radar: false

calibration:
  extrinsics_file: "/workspace/calibration/extrinsics.json"
  intrinsics_file: "/workspace/calibration/intrinsics.json"
  time_sync_tolerance_ms: 10

fusion:
  type: "late"
  decision_fusion:
    method: "weighted"
    weights:
      camera: 0.6
      lidar: 0.4
    conflict_resolution: "highest_confidence"

model:
  detector_camera: "yolov8"
  detector_lidar: "pointpillars"
  tracker: "byte_track"
  confidence_threshold: 0.30

runtime:
  sensor_health_monitoring: true
  degradation_mode: "fallback"   # fallback to single-sensor

eval:
  weather_conditions: ["clear", "rain", "night", "fog"]
  metrics: ["mAP", "tracking_accuracy", "fusion_consistency"]
