
pipeline:
  name: "ADAS Sensor Failure Simulation"
  fusion_strategy: "early"

data:
  dataset: "nuscenes"
  root: "/workspace/data/nuscenes"
  sensors:
    camera: true
    lidar: true

sensor_failure:
  simulate:
    camera_blackout:
      enabled: true
      probability: 0.15
      duration_frames: 20

    lidar_dropout:
      enabled: true
      probability: 0.10
      missing_channels: [3, 4, 5]

    random_noise_injection:
      enabled: true
      camera_noise_std: 0.05
      lidar_noise_std: 0.02

runtime:
  degradation_logic:
    mode: "graceful"
    fallback_detector: "lidar_only"
    fallback_confidence_threshold: 0.25

eval:
  failure_scenarios: ["camera_blackout", "lidar_dropout"]
  metrics: ["robust_mAP", "failure_recovery_time", "tracking_stability"]
