
pipeline:
  name: "ADAS Multi-Sensor Perception"
  fusion_strategy: "early"

data:
  dataset: "nuscenes"
  root: "/workspace/data/nuscenes"
  sensors:
    camera: true
    lidar: true
    radar: false

calibration:
  extrinsics_file: "/workspace/calibration/extrinsics.json"
  intrinsics_file: "/workspace/calibration/intrinsics.json"
  time_sync_tolerance_ms: 10

fusion:
  type: "early"
  feature_dimensions:
    camera: 256
    lidar: 256
  fusion_method: "concat"   # concat + MLP
  mlp_layers: [512, 256, 128]

model:
  detector: "pointpillars"
  tracker: "kalman"
  confidence_threshold: 0.35

runtime:
  sensor_health_monitoring: true
  degradation_mode: "graceful"

eval:
  weather_conditions: ["clear", "rain", "night", "fog"]
  metrics: ["mAP", "tracking_accuracy", "latency_ms"]
